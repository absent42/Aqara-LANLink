play_audio_file:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: aqara_lanlink
    file_path:
      required: true
      example: /media/chime.aac
      selector:
        text:

scan_device:
  name: Scan device for new traits
  description: Runs a one-shot cloud scan against one Aqara device to recover traits the shipped V3 catalogue is missing. Intended for the small number of models not yet catalogued, or when firmware adds new traits to a previously catalogued model; not needed for routine use.
  fields:
    device_id:
      name: Device
      description: The HA device to scan.
      required: true
      selector:
        device:
          integration: aqara_lanlink

export_overlay:
  name: Export overlay for PR
  description: Renders accepted overlay traits as a Python TraitSpec snippet ready to paste into a model package's overrides.py OVERRIDES dict, then posts the result as a Persistent Notification. Intended for submitting catalogue PRs after running scan_device.
  fields:
    model:
      name: Model
      description: Restrict the export to one model. Omit to render all models in the overlay.
      required: false
      example: "lumi.camera.acn003"
      selector:
        text:

ptz:
  name: PTZ control
  description: Control a PTZ camera with a single action. The command selects what to do; value, continuous, and duration refine it. One service so dashboards (including the WebRTC card) can drive every PTZ action through one action key.
  target:
    entity:
      integration: aqara_lanlink
      domain: camera
  fields:
    command:
      name: Command
      description: What to do. up/down/left/right pan or tilt; stop halts a continuous move; zoom_in/zoom_out step the zoom; zoom sets an absolute magnification (needs value); preset recalls a saved position (needs value).
      required: true
      selector:
        select:
          options:
            - up
            - down
            - left
            - right
            - stop
            - zoom_in
            - zoom_out
            - zoom
            - preset
    value:
      name: Value
      description: "For zoom: the magnification (1.0 widest to 9.0 tele). For zoom_in/zoom_out: the step size in magnification (default 1.0). For preset: the preset name (as set in the Aqara app) or its numeric id. Ignored by other commands."
      required: false
      example: Front door
      selector:
        text:
    continuous:
      name: Continuous
      description: For up/down/left/right, move continuously until stop is sent (or duration elapses) instead of a single nudge.
      required: false
      default: false
      selector:
        boolean:
    duration:
      name: Duration
      description: For a continuous directional move, seconds to move before auto-stopping. Omit to move until stop.
      required: false
      example: 1.5
      selector:
        number:
          min: 0.1
          max: 30
          step: 0.1
          unit_of_measurement: s
          mode: box
